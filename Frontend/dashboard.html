<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <h1>Inventory Management System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="categories.html">Categories</a>
        <a href="suppliers.html">Suppliers</a>
        <a href="contact.html">Contact</a>

        <button onclick="logout()">Logout</button>
    </nav>
</header>

<div class="dashboard-container">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>📦 Products</h3>
            <h1 id="totalProducts">0</h1>
        </div>

        <div class="card">
            <h3>📂 Categories</h3>
            <h1 id="totalCategories">0</h1>
        </div>

        <div class="card">
            <h3>🚚 Suppliers</h3>
            <h1 id="totalSuppliers">0</h1>
        </div>

        <div class="card">
            <h3>⚠ Low Stock</h3>
            <h1 id="lowStock">0</h1>
        </div>

    </div>

    <div class="quick-links">

        <a href="products.html" class="btn">Manage Products</a>

        <a href="categories.html" class="btn">Manage Categories</a>

        <a href="suppliers.html" class="btn">Manage Suppliers</a>

    </div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
